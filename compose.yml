name: seatsync
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seatsync
      POSTGRES_PASSWORD: seatsync
      POSTGRES_DB: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatsync"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: bitnami/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["29092:29092"]

  event-service:
    build: {context: ., args: {SERVICE: event-service}}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seatsync_events
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_started}}
    ports: ["8081:8081"]

  reservation-service:
    build: {context: ., args: {SERVICE: reservation-service}}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seatsync_reservations
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, kafka: {condition: service_started}}
    ports: ["8082:8082", "9082:9082"]

  payment-service:
    build: {context: ., args: {SERVICE: payment-service}}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seatsync_payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_started}}
    ports: ["8084:8084"]

  booking-service:
    build: {context: ., args: {SERVICE: booking-service}}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seatsync_bookings
      RESERVATION_GRPC_HOST: reservation-service
      PAYMENT_URL: http://payment-service:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: {postgres: {condition: service_healthy}, reservation-service: {condition: service_started}, payment-service: {condition: service_started}}
    ports: ["8083:8083"]

  gateway-service:
    build: {context: ., args: {SERVICE: gateway-service}}
    environment:
      REDIS_HOST: redis
      EVENT_SERVICE_URL: http://event-service:8081
      RESERVATION_SERVICE_URL: http://reservation-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
    depends_on: {redis: {condition: service_healthy}, event-service: {condition: service_started}, reservation-service: {condition: service_started}, booking-service: {condition: service_started}}
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    environment: {GF_SECURITY_ADMIN_PASSWORD: seatsync}
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
