name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: mvn -B -DskipTests package
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [gateway-service, event-service, reservation-service, booking-service, payment-service]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: SERVICE=${{ matrix.service }}
          tags: seatsync/${{ matrix.service }}:${{ github.sha }}
