server.port: 8080
spring:
  application.name: gateway-service
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  cloud.gateway.routes:
    - id: events
      uri: ${EVENT_SERVICE_URL:http://localhost:8081}
      predicates: [Path=/api/events/**]
    - id: reservations
      uri: ${RESERVATION_SERVICE_URL:http://localhost:8082}
      predicates: [Path=/api/reservations/**]
      filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@customerKeyResolver}"
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
    - id: bookings
      uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
      predicates: [Path=/api/bookings/**]
      filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@customerKeyResolver}"
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
management:
  endpoints.web.exposure.include: health,info,prometheus,gateway
  endpoint.health.probes.enabled: true
---
spring:
  config.activate.on-profile: prod
  security.oauth2.resourceserver.jwt.issuer-uri: ${JWT_ISSUER_URI}
